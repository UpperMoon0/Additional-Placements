name: Forge 1.20.1 regression and build

on:
  push:
    branches:
      - '1.20.1'
      - 'fix/**'
  pull_request:
    branches:
      - '1.20.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 21 for Loom
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Run delegation regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Forge production jar
        run: |
          gradle :forge:build --no-daemon --max-workers=2 --console=plain
      - name: Execute Forge dedicated-server regression GameTests
        run: |
          mkdir -p forge/run
          printf 'eula=true\n' > forge/run/eula.txt
          gradle :forge:runGameTestServer --no-daemon --max-workers=2 --console=plain
      - name: Verify and stage remapped production JAR
        run: python3 tests/verify_forge_jar.py --stage
      - name: Upload Forge jar for isolated validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: additional-placements-forge-1.20.1
          path: dist/additionalplacements-forge-3.0.1.2.jar
          if-no-files-found: error
          retention-days: 7
