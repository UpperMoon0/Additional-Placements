name: Forge 1.20.1 regression and build

on:
  push:
    branches:
      - '1.20.1'
      - 'fix/**'
  pull_request:
    branches:
      - '1.20.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run delegation regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Forge production jar
        run: |
          chmod +x ./gradlew
          ./gradlew :forge:build --no-daemon --max-workers=2 --console=plain
      - name: Upload Forge jar for isolated validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: additional-placements-forge-1.20.1
          path: forge/build/libs/*.jar
          retention-days: 7
